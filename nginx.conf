server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for less overhead
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/linkset+json;

    # Correct MIME types for well-known files
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # robots.txt and sitemap
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        # Link headers for agent discovery (RFC 8288)
        add_header Link '</.well-known/agent-skills/index.json>; rel="https://agentskills.io/rel/skills"';
        add_header Link '</sitemap.xml>; rel="sitemap"';
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"';

        # Try finding a direct file match, then a directory, then a .html file, and finally fallback to index.html
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache static assets for less overhead
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
